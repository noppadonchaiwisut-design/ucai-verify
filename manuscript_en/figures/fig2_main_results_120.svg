<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="1060" height="540">
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 12.5px; fill: #cbd5e1; }
      .ax { font-size: 12px; fill: #334155; font-weight: 600; }
      .val { font-size: 12.5px; font-weight: 700; }
      .ml { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .ms { font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <rect width="1060" height="540" rx="12" fill="#f8fafc"/>
  <rect width="1060" height="68" rx="12" fill="#0f172a"/>
  <rect y="44" width="1060" height="24" fill="#0f172a"/>
  <text x="26" y="31" class="h1">Figure 2: Empirical Comparison on UCAI-CitationAudit-Bench-v1 (Full N = 120, 95% Bootstrap CIs)</text>
  <text x="26" y="52" class="sub">Precision, Recall, F1-Score (Higher Better ↑) vs. False Positive Rate on Real Papers (Lower Better ↓)</text>

  <!-- Legend -->
  <rect x="530" y="80" width="500" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="544" y="90" width="14" height="12" rx="2" fill="#2563eb"/><text x="564" y="100" class="ax">Precision</text>
  <rect x="642" y="90" width="14" height="12" rx="2" fill="#0d9488"/><text x="662" y="100" class="ax">Recall</text>
  <rect x="726" y="90" width="14" height="12" rx="2" fill="#059669"/><text x="746" y="100" class="ax">F1-Score</text>
  <rect x="826" y="90" width="14" height="12" rx="2" fill="#dc2626"/><text x="846" y="100" class="ax">False Positive Rate (FPR ↓)</text>

  <!-- Plot y=135 (1.0) to y=415 (0.0), height=280px -->
  <line x1="76" y1="135" x2="1030" y2="135" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <line x1="76" y1="205" x2="1030" y2="205" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <line x1="76" y1="275" x2="1030" y2="275" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <line x1="76" y1="345" x2="1030" y2="345" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <line x1="76" y1="415" x2="1030" y2="415" stroke="#334155" stroke-width="1.8"/>

  <text x="68" y="139" text-anchor="end" class="ax">1.00</text>
  <text x="68" y="209" text-anchor="end" class="ax">0.75</text>
  <text x="68" y="279" text-anchor="end" class="ax">0.50</text>
  <text x="68" y="349" text-anchor="end" class="ax">0.25</text>
  <text x="68" y="419" text-anchor="end" class="ax">0.00</text>

  <!-- Method 1: Stage 1 (P=1.00, R=0.75, F1=0.857, FPR=0.00) x_start=105 -->
  <rect x="105" y="135" width="32" height="280" rx="3" fill="#2563eb"/><text x="121" y="128" text-anchor="middle" class="val" fill="#1d4ed8">1.00</text>
  <rect x="140" y="205" width="32" height="210" rx="3" fill="#0d9488"/><text x="156" y="198" text-anchor="middle" class="val" fill="#0f766e">0.75</text>
  <rect x="175" y="175" width="32" height="240" rx="3" fill="#059669"/><text x="191" y="154" text-anchor="middle" class="val" fill="#047857">0.86</text>
  <line x1="191" y1="160" x2="191" y2="191" stroke="#064e3b" stroke-width="2"/>
  <rect x="210" y="412" width="32" height="3" rx="1" fill="#16a34a"/><text x="226" y="404" text-anchor="middle" class="val" fill="#15803d">0.00</text>
  <text x="173" y="438" text-anchor="middle" class="ml">ucai-verify Stage 1</text>
  <text x="173" y="454" text-anchor="middle" class="ms">($0 API | 0.15 s/item)</text>

  <!-- Method 2: Hybrid Local NLI (P=0.957, R=0.917, F1=0.936, FPR=0.167) x_start=295 -->
  <rect x="295" y="147" width="32" height="268" rx="3" fill="#2563eb"/><text x="311" y="140" text-anchor="middle" class="val" fill="#1d4ed8">0.96</text>
  <rect x="330" y="158" width="32" height="257" rx="3" fill="#0d9488"/><text x="346" y="151" text-anchor="middle" class="val" fill="#0f766e">0.92</text>
  <rect x="365" y="153" width="32" height="262" rx="3" fill="#059669"/><text x="381" y="138" text-anchor="middle" class="val" fill="#047857">0.94*</text>
  <line x1="381" y1="144" x2="381" y2="164" stroke="#064e3b" stroke-width="2"/>
  <rect x="400" y="368" width="32" height="47" rx="3" fill="#f87171"/><text x="416" y="361" text-anchor="middle" class="val" fill="#b91c1c">0.17</text>
  <text x="363" y="438" text-anchor="middle" class="ml">Hybrid (Local NLI)</text>
  <text x="363" y="454" text-anchor="middle" class="ms">($0 API | p = 0.0146*)</text>

  <!-- Method 3: Hybrid Scoped Gemini (P=0.960, R=1.000, F1=0.980, FPR=0.167) x_start=485 -->
  <rect x="479" y="112" width="149" height="309" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4,3"/>
  <rect x="485" y="146" width="32" height="269" rx="3" fill="#2563eb"/><text x="501" y="139" text-anchor="middle" class="val" fill="#1d4ed8">0.96</text>
  <rect x="520" y="135" width="32" height="280" rx="3" fill="#0d9488"/><text x="536" y="128" text-anchor="middle" class="val" fill="#0f766e">1.00</text>
  <rect x="555" y="141" width="32" height="274" rx="3" fill="#059669"/><text x="574" y="129" text-anchor="middle" class="val" fill="#047857">0.98***</text>
  <line x1="571" y1="136" x2="571" y2="146" stroke="#064e3b" stroke-width="2"/>
  <rect x="590" y="368" width="32" height="47" rx="3" fill="#f87171"/><text x="606" y="361" text-anchor="middle" class="val" fill="#b91c1c">0.17</text>
  <text x="553" y="438" text-anchor="middle" class="ml" fill="#047857">Hybrid (Scoped LLM)</text>
  <text x="553" y="454" text-anchor="middle" class="ms">(-60% Calls | p = 1e-6***)</text>

  <!-- Method 4: Self-Critique (P=0.823, R=0.969, F1=0.890, FPR=0.833) x_start=675 -->
  <rect x="675" y="185" width="32" height="230" rx="3" fill="#64748b"/><text x="691" y="178" text-anchor="middle" class="val" fill="#475569">0.82</text>
  <rect x="710" y="144" width="32" height="271" rx="3" fill="#94a3b8"/><text x="726" y="137" text-anchor="middle" class="val" fill="#475569">0.97</text>
  <rect x="745" y="166" width="32" height="249" rx="3" fill="#475569"/><text x="761" y="159" text-anchor="middle" class="val" fill="#334155">0.89</text>
  <rect x="780" y="182" width="32" height="233" rx="3" fill="#dc2626"/><text x="796" y="175" text-anchor="middle" class="val" fill="#dc2626">0.83!</text>
  <text x="743" y="438" text-anchor="middle" class="ml">Pure Self-Critique</text>
  <text x="743" y="454" text-anchor="middle" class="ms">(120 Calls | 9.07 s/item)</text>

  <!-- Method 5: LLM Judge (P=0.809, R=0.969, F1=0.882, FPR=0.917) x_start=865 -->
  <rect x="865" y="189" width="32" height="226" rx="3" fill="#64748b"/><text x="881" y="182" text-anchor="middle" class="val" fill="#475569">0.81</text>
  <rect x="900" y="144" width="32" height="271" rx="3" fill="#94a3b8"/><text x="916" y="137" text-anchor="middle" class="val" fill="#475569">0.97</text>
  <rect x="935" y="168" width="32" height="247" rx="3" fill="#475569"/><text x="951" y="161" text-anchor="middle" class="val" fill="#334155">0.88</text>
  <rect x="970" y="158" width="32" height="257" rx="3" fill="#b91c1c"/><text x="986" y="151" text-anchor="middle" class="val" fill="#991b1b">0.92!</text>
  <text x="933" y="438" text-anchor="middle" class="ml">Pure LLM-as-a-Judge</text>
  <text x="933" y="454" text-anchor="middle" class="ms">(120 Calls | 7.07 s/item)</text>

  <rect x="76" y="476" width="954" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="553" y="495" text-anchor="middle" class="ml" fill="#1e3a8a">Pure-LLM False-Positive Trap: Without live registry access, Pure LLM-as-a-Judge falsely flags 22/24 real 2024–2026 papers (FPR = 91.7%).</text>
  <text x="553" y="512" text-anchor="middle" class="ms" fill="#1e40af">Exact paired McNemar's test vs. Pure LLM-as-a-Judge (N=120): *p = 0.0146 (Hybrid-NLI, 19:6 wins); ***p = 1.0e-6 (Hybrid-Scoped-LLM, 21:0 wins).</text>
</svg>